services:
  bot:
    image: ${BOT_IMAGE:-ghcr.io/evgenykravchenko/vk-content-bot}:${BOT_VERSION:?BOT_VERSION must be a SemVer release such as 0.2.0}
    environment:
      DIRECTUS_URL: http://directus:8055
    networks: [egress, platform]

networks:
  egress:
    driver: bridge
  platform:
    name: bot_platform_backend
    external: true
