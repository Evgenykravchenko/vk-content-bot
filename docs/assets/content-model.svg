<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
  <title id="title">Модель контента VK Content Bot</title>
  <desc id="desc">Связи настроек бота, ключевых слов, ответов, блоков, медиа и кнопок</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect width="1200" height="660" rx="24" fill="url(#bg)"/>
  <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif">
    <text x="48" y="54" font-size="26" font-weight="700" fill="#0f172a">Контент собирается из понятных частей</text>
    <text x="48" y="84" font-size="15" fill="#64748b">Редактор связывает готовый ответ с ключевыми словами, файлами и кнопками</text>

    <g fill="#fff" stroke="#cbd5e1" stroke-width="2">
      <rect x="48" y="126" width="230" height="180" rx="16"/>
      <rect x="330" y="126" width="230" height="180" rx="16"/>
      <rect x="612" y="126" width="250" height="180" rx="16"/>
      <rect x="914" y="126" width="238" height="180" rx="16"/>
      <rect x="188" y="376" width="260" height="142" rx="16"/>
      <rect x="548" y="376" width="464" height="142" rx="16"/>
    </g>

    <g fill="#0f172a" font-size="18" font-weight="700">
      <text x="72" y="165">Ключевые слова</text>
      <text x="354" y="165">Ответ</text>
      <text x="636" y="165">Блоки ответа</text>
      <text x="938" y="165">Медиа</text>
      <text x="212" y="415">Настройки бота</text>
      <text x="572" y="415">Кнопки</text>
    </g>

    <g fill="#64748b" font-size="14">
      <text x="72" y="202">фраза пользователя</text>
      <text x="72" y="230">тип совпадения</text>
      <text x="72" y="258">приоритет</text>

      <text x="354" y="202">название для редактора</text>
      <text x="354" y="230">черновик / опубликован</text>
      <text x="354" y="258">резервный текст</text>

      <text x="636" y="202">текст · фото · видео</text>
      <text x="636" y="230">аудио · документ</text>
      <text x="636" y="258">порядок · отдельная отправка</text>

      <text x="938" y="202">путь на Яндекс Диске</text>
      <text x="938" y="230">статус подготовки</text>
      <text x="938" y="258">готовый VK ID</text>

      <text x="212" y="452">неизвестное сообщение</text>
      <text x="212" y="480">полноценный fallback-ответ</text>

      <text x="572" y="452">команда → ключевая фраза</text>
      <text x="572" y="480">ссылка → https:// URL</text>
      <text x="824" y="452">ряд</text>
      <text x="824" y="480">порядок · цвет</text>
    </g>

    <g fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)">
      <path d="M278 216H320"/>
      <path d="M560 216H602"/>
      <path d="M862 216H904"/>
      <path d="M495 306V338H700V376"/>
    </g>
    <path d="M318 376V338H395V306" fill="none" stroke="#2563eb" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrow)"/>

    <g fill="#2563eb" font-size="12" font-weight="700">
      <text x="288" y="202">N:1</text>
      <text x="570" y="202">1:N</text>
      <text x="872" y="202">N:1</text>
      <text x="330" y="332">N:1</text>
      <text x="610" y="330">1:N</text>
    </g>

    <rect x="48" y="582" width="1104" height="30" rx="10" fill="#dbeafe"/>
    <text x="68" y="602" fill="#1e40af" font-size="13">Выберите одного бота для настроек, ответов, ключевых слов и медиа.</text>
  </g>
</svg>
