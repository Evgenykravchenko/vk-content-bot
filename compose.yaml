name: vk-content-bot

services:
  bot:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    extra_hosts:
      - host.docker.internal:host-gateway
    environment:
      NODE_ENV: production
      NODE_OPTIONS: ${NODE_OPTIONS:-}
      VK_TOKEN: ${VK_TOKEN}
      VK_VIDEO_TOKEN: ${VK_VIDEO_TOKEN:-}
      VK_VIDEO_REFRESH_TOKEN: ${VK_VIDEO_REFRESH_TOKEN:-}
      VK_VIDEO_DEVICE_ID: ${VK_VIDEO_DEVICE_ID:-}
      VK_VIDEO_CLIENT_ID: ${VK_VIDEO_CLIENT_ID:-0}
      VK_VIDEO_REDIRECT_URI: ${VK_VIDEO_REDIRECT_URI:-https://bot-content-cms.tailcc0b45.ts.net/vk-oauth/callback}
      VK_VIDEO_TOKEN_EXPIRES_AT: ${VK_VIDEO_TOKEN_EXPIRES_AT:-0}
      VK_VIDEO_TOKEN_FILE: /var/lib/vk-content-bot/vk-video-token.json
      VK_GROUP_ID: ${VK_GROUP_ID}
      VK_MEDIA_UPLOAD_PEER_ID: ${VK_MEDIA_UPLOAD_PEER_ID}
      BOTCRM_URL: ${BOTCRM_URL:-http://host.docker.internal:4100/api/v1}
      BOTCRM_CONTENT_TOKEN: ${BOTCRM_CONTENT_TOKEN}
      BOTCRM_DIALOG_TOKEN: ${BOTCRM_DIALOG_TOKEN}
      BOTCRM_WORKSPACE_ID: ${BOTCRM_WORKSPACE_ID:-ws_demo}
      BOTCRM_BOT_SLUG: ${BOTCRM_BOT_SLUG:-vk_content_bot}
      YANDEX_DISK_TOKEN: ${YANDEX_DISK_TOKEN:-}
      YANDEX_DISK_ROOT: ${YANDEX_DISK_ROOT:-/VK Bot}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      RULE_CACHE_TTL_SECONDS: ${RULE_CACHE_TTL_SECONDS:-30}
      MEDIA_POLL_INTERVAL_SECONDS: ${MEDIA_POLL_INTERVAL_SECONDS:-20}
      MEDIA_BATCH_SIZE: ${MEDIA_BATCH_SIZE:-3}
      MEDIA_UPLOAD_TIMEOUT_SECONDS: ${MEDIA_UPLOAD_TIMEOUT_SECONDS:-1800}
    volumes:
      - vk_video_auth:/var/lib/vk-content-bot
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  checks:
    profiles: [tools]
    build:
      context: .
      target: checks
    command: [npm, test]

volumes:
  vk_video_auth:
