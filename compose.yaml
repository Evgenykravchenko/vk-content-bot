name: vk-content-bot

services:
  bot:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    extra_hosts:
      - host.docker.internal:host-gateway
    environment:
      NODE_ENV: production
      VK_TOKEN: ${VK_TOKEN}
      VK_GROUP_ID: ${VK_GROUP_ID}
      VK_MEDIA_UPLOAD_PEER_ID: ${VK_MEDIA_UPLOAD_PEER_ID}
      CONTENT_BOT_KEY: ${CONTENT_BOT_KEY:-vk-content-bot}
      DIRECTUS_URL: ${DIRECTUS_URL:-http://host.docker.internal:8055}
      DIRECTUS_TOKEN: ${DIRECTUS_TOKEN}
      YANDEX_DISK_TOKEN: ${YANDEX_DISK_TOKEN:-}
      YANDEX_DISK_ROOT: ${YANDEX_DISK_ROOT:-/VK Bot}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      RULE_CACHE_TTL_SECONDS: ${RULE_CACHE_TTL_SECONDS:-30}
      MEDIA_POLL_INTERVAL_SECONDS: ${MEDIA_POLL_INTERVAL_SECONDS:-20}
      MEDIA_BATCH_SIZE: ${MEDIA_BATCH_SIZE:-3}
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  checks:
    profiles: [tools]
    build:
      context: .
      target: checks
    command: [npm, test]
